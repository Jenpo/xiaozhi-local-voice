<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" width="960" height="620" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
    </marker>
    <marker id="arrowblue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <style>
      .box{fill:#ffffff;stroke:#d1d5db;stroke-width:1.5;rx:12}
      .accent{fill:#eff6ff;stroke:#93c5fd;stroke-width:1.5;rx:12}
      .net{fill:#f9fafb;stroke:#d1d5db;stroke-width:1.5;rx:12;stroke-dasharray:6 4}
      .t{fill:#111827;font-size:15px;font-weight:600}
      .s{fill:#6b7280;font-size:12.5px}
      .lbl{fill:#374151;font-size:12.5px}
      .lblb{fill:#2563eb;font-size:12.5px;font-weight:600}
      .cap{fill:#111827;font-size:17px;font-weight:700}
    </style>
  </defs>

  <rect x="0" y="0" width="960" height="620" fill="#ffffff"/>

  <!-- Device -->
  <rect class="box" x="50" y="400" width="230" height="130"/>
  <text class="t" x="70" y="432">设备 · AI 玩具</text>
  <text class="s" x="70" y="456">ESP32-C3 · 8MB · 无 PSRAM</text>
  <text class="s" x="70" y="476">ST7789 SPI 小屏</text>
  <text class="s" x="70" y="496">麦克风 + 扬声器</text>

  <!-- OTA gateway -->
  <rect class="net" x="50" y="120" width="230" height="140"/>
  <text class="t" x="70" y="152">极简 OTA 网关</text>
  <text class="s" x="70" y="176">Node · 约 40MB 容器</text>
  <text class="s" x="70" y="196">旧服务器上，不在音频链路</text>
  <text class="s" x="70" y="222">:18003  OTA 应答</text>
  <text class="s" x="70" y="242">:18000  WS TCP 转发</text>

  <!-- arrows device <-> ota -->
  <line x1="130" y1="398" x2="130" y2="262" stroke="#4b5563" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text class="lbl" x="140" y="320">① OTA 请求</text>
  <text class="s" x="140" y="338">（固件把地址写死在这里）</text>
  <line x1="185" y1="262" x2="185" y2="398" stroke="#4b5563" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text class="lbl" x="196" y="360">② 返回 ws://Mac mini:8000</text>

  <!-- Mac mini container -->
  <rect x="360" y="70" width="560" height="500" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text class="cap" x="386" y="104">Mac mini（Apple Silicon）· 全部本地</text>

  <!-- xiaozhi server -->
  <rect class="accent" x="386" y="130" width="200" height="410"/>
  <text class="t" x="406" y="164">xiaozhi-esp32-server</text>
  <text class="s" x="406" y="188">:8000 WebSocket</text>
  <text class="s" x="406" y="208">:8003 HTTP / OTA</text>
  <text class="s" x="406" y="240">SileroVAD</text>
  <text class="s" x="406" y="260">min_silence 500ms</text>
  <text class="s" x="406" y="292">会话管理 · 句子切分</text>
  <text class="s" x="406" y="312">prompt 模板</text>
  <text class="s" x="406" y="344">launchd com.xz.server</text>
  <text class="s" x="406" y="380">内存 · 意图模块</text>
  <text class="s" x="406" y="400">已关闭（省时）</text>

  <!-- services -->
  <rect class="box" x="620" y="130" width="270" height="110"/>
  <text class="t" x="640" y="162">ASR · 语音识别</text>
  <text class="s" x="640" y="186">:8879 sherpa-onnx SenseVoice</text>
  <text class="s" x="640" y="206">language=en · ~0.15s</text>
  <text class="s" x="640" y="226">launchd com.xz.asr</text>

  <rect class="box" x="620" y="260" width="270" height="110"/>
  <text class="t" x="640" y="292">LLM · 对话模型</text>
  <text class="s" x="640" y="316">:8890 mlx_lm.server</text>
  <text class="s" x="640" y="336">Qwen2.5-3B-Instruct-4bit</text>
  <text class="s" x="640" y="356">首 token 0.2-0.7s</text>

  <rect class="box" x="620" y="390" width="270" height="110"/>
  <text class="t" x="640" y="422">TTS · 语音合成</text>
  <text class="s" x="640" y="446">:8880 常驻 Piper</text>
  <text class="s" x="640" y="466">0.15-0.2s / 句</text>
  <text class="s" x="640" y="486">失败回退 macOS say</text>

  <!-- arrows device -> server -->
  <line x1="282" y1="465" x2="384" y2="440" stroke="#2563eb" stroke-width="2" marker-end="url(#arrowblue)"/>
  <text class="lblb" x="286" y="430">③ WebSocket 音频流</text>

  <!-- arrows server -> services -->
  <line x1="588" y1="200" x2="618" y2="185" stroke="#4b5563" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="588" y1="330" x2="618" y2="315" stroke="#4b5563" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="588" y1="450" x2="618" y2="445" stroke="#4b5563" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- watchdog -->
  <rect class="net" x="620" y="516" width="270" height="40"/>
  <text class="s" x="640" y="541">看门狗：每 180s 探测 :8890，异常自动重启 LLM</text>
</svg>
